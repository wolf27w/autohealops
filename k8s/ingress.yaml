# Ingress：/ → frontend，/api/v1 → api-server
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autohealops-ingress
  namespace: autohealops
spec:
  rules:
    - host: autohealops.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
