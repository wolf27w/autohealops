# 各服务 Service
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: autohealops
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-executor
  namespace: autohealops
spec:
  selector:
    app: k8s-executor
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    # 实时日志跟随（api-server 的 EXECUTOR_LOGSTREAM_ADDR 指这里）
    - name: logstream
      port: 9099
      targetPort: 9099
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: autohealops
spec:
  selector:
    app: ai-service
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autohealops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# Agent 反向隧道网关（被管集群的 agent 主动连这里，9095）
# 注意：跨集群接入时，其它集群必须能访问到 → 三选一：
#   1) type: NodePort（简单，端口如 30905，AGENT_GATEWAY_PUBLIC_ADDR 用 <节点IP>:30905）
#   2) type: LoadBalancer（云环境，需公网/内网 LB）
#   3) 保持 ClusterIP + 外层 nginx/SamWaf 做 TCP 四层转发（不要用 HTTP 反代，gRPC 长连接）
# 改成 NodePort 的写法：
#   type: NodePort
#   ports:
#     - port: 9095
#       targetPort: 9095
#       nodePort: 30905
apiVersion: v1
kind: Service
metadata:
  name: api-server-agent-gateway
  namespace: autohealops
spec:
  selector:
    app: agent-gateway
  ports:
    - port: 9095
      targetPort: 9095
      name: agent-gateway
  type: ClusterIP
---
# agent-gateway 内部 gRPC（api-server 经此转发隧道调用）
apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: autohealops
spec:
  selector:
    app: agent-gateway
  ports:
    - port: 9096
      targetPort: 9096
      name: internal
  type: ClusterIP
