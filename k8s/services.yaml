# 各服务 Service
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: api-ops
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-executor
  namespace: api-ops
spec:
  selector:
    app: k8s-executor
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: api-ops
spec:
  selector:
    app: ai-service
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: api-ops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
