# 各服务 Service
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: api-ops
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-executor
  namespace: api-ops
spec:
  selector:
    app: k8s-executor
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: api-ops
spec:
  selector:
    app: ai-service
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: api-ops
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# Agent 反向隧道网关（被管集群的 agent 主动连这里，端口 9095）
# 注意：跨集群接入时，这个端口必须让「其它集群」能访问到 → 需要改成 NodePort/LoadBalancer
# 或走 nginx/SamWaf 的 TCP 四层转发；ClusterIP 仅集群内可达。
apiVersion: v1
kind: Service
metadata:
  name: api-server-agent-gateway
  namespace: api-ops
spec:
  selector:
    app: api-server
  ports:
    - port: 9095
      targetPort: 9095
  type: ClusterIP
