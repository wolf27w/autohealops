# Pod 中断预算
#
# api-server 目前单副本（agent 网关单写者），PDB 用 maxUnavailable 才有意义；
# minAvailable 会让节点维护永远排不空。
# 等网关拆分、api-server 恢复多副本后再把 minAvailable 加回来（如 minAvailable: 2）。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server-pdb
  namespace: autohealops
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-service-pdb
  namespace: autohealops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-service
