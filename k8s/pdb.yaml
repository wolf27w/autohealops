# Pod 中断预算
#
# api-server 多副本（R2 拆网关后）：用 minAvailable 保证至少 2 副本可用。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server-pdb
  namespace: autohealops
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-service-pdb
  namespace: autohealops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-service
