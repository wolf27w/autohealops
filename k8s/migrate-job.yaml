# ============================================================
# 数据库迁移 Job（多副本部署时使用）
#
# 背景：api-server 多副本时，如果每个 Pod 启动都跑 `alembic upgrade head`，
#   并发拿 DDL 锁 → Pod 长时间不 Ready、CPU 飙高（实测触发 HPA 打满）。
#   所以 Deployment 里 RUN_MIGRATIONS=false，迁移改由本 Job 在发布前执行一次。
#
# 用法：
#   kubectl -n autohealops delete job api-server-migrate --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl -n autohealops wait --for=condition=complete job/api-server-migrate --timeout=600s
#
# ⚠️ Job 名字固定 → 每次发布前先 delete（上面第一条），否则 apply 不会重跑。
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: api-server-migrate
  namespace: autohealops
  labels:
    app: api-server-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: api-server-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: autohealops/api-server:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: api-server-config
            - secretRef:
                name: autohealops-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
