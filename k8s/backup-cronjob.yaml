# 每日备份 CronJob：mysqldump 到对象存储（备份包必须同时包含 ENCRYPTION_KEY）
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: api-ops
spec:
  schedule: "0 2 * * *"  # 每日 2:00
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mysql:8.0
              command:
                - /bin/sh
                - -c
                - |
                  mysqldump -h 192.168.6.99 -uroot -proot api_ops > /backup/api_ops-$(date +%Y%m%d).sql
                  # TODO: 上传到对象存储（如 OSS/S3/COS）
                  # 注意：ENCRYPTION_KEY 必须随备份一起保存，否则恢复后 kubeconfig 密文无法解密
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
