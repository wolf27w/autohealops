# ============================================================
# 敏感配置（Secret）模板
#
# ⚠️ 本文件只是模板，占位值不能直接上线。
#    实际部署用：
#        ./scripts/gen-k8s-config.sh            # 从项目根 .env 生成 k8s/generated/secret.yaml
#        kubectl -n autohealops apply -f k8s/generated/secret.yaml
#    也可以手工：
#        cp k8s/secret.example.yaml k8s/generated/secret.yaml   # 填真实值（stringData 明文即可，k8s 自己编码）
#
# 生成物在 k8s/generated/（.gitignore 忽略）——真实密钥不进 git。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: autohealops-secrets
  namespace: autohealops
type: Opaque
stringData:
  # ---------- 数据库 / Redis（连接串里带密码，因此必须放 Secret）----------
  DATABASE_URL: "mysql+aiomysql://USER:PASSWORD@HOST:3306/autohealops"
  REDIS_URL: "redis://:PASSWORD@HOST:6379/0"

  # ---------- 密钥（所有服务必须一致）----------
  JWT_SECRET_KEY: "REPLACE_ME_JWT_SECRET_KEY"
  # 32 字节（256 位），与 Go 端一致；丢了已加密的 kubeconfig 就无法解密
  ENCRYPTION_KEY: "REPLACE_ME_32BYTES_ENCRYPTION_KEY!"

  # ---------- 初始管理员密码（可选；留空=首次启动随机生成并打印日志）----------
  ADMIN_INITIAL_PASSWORD: ""

  # ---------- 镜像仓库只读凭据（R3 列标签用；可选）----------
  REGISTRY_USERNAME: ""
  REGISTRY_PASSWORD: ""
  # 按 host 配的凭据（JSON，优先于全局）：
  #   REGISTRY_CREDS: '{"harbor.efreight.cn":{"username":"ro","password":"***"}}'
  REGISTRY_CREDS: ""
