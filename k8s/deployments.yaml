# 各服务 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: api-ops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [api-server]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api-server
          image: api-ops/api-server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-server-config
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: ENCRYPTION_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: JWT_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-executor
  namespace: api-ops
spec:
  replicas: 1  # 固定单副本（有状态 watcher，多副本重复 watch）
  selector:
    matchLabels:
      app: k8s-executor
  template:
    metadata:
      labels:
        app: k8s-executor
    spec:
      containers:
        - name: k8s-executor
          image: api-ops/k8s-executor:latest
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: k8s-executor-config
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: ENCRYPTION_KEY
          readinessProbe:
            tcpSocket:
              port: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: api-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: api-ops/ai-service:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ai-service-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: OPENAI_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: DEEPSEEK_API_KEY
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-ops-secrets
                  key: CLAUDE_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: api-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: api-ops/frontend:latest
          ports:
            - containerPort: 80
