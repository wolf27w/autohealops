# ============================================================
# 各服务 Deployment
#
# 配置注入规则：
#   - 非敏感项 → ConfigMap（configmap.yaml）
#   - 敏感项   → Secret autohealops-secrets（secret.example.yaml / 生成的 secret.yaml）
#   - 一律用 envFrom 整包注入，不在 Deployment 里逐个写 env（避免漏项漂移）
#   - Pod 里没有 .env 文件：pydantic-settings / viper 都优先读环境变量
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: autohealops
spec:
  # R2 拆网关后：隧道网关已拆到独立 agent-gateway Deployment，api-server 可多副本
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: autohealops/api-server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-server-config
            - secretRef:
                name: autohealops-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
# Agent 反向隧道网关（R2 拆网关：从 api-server 拆出，单副本 + Recreate，独占 CA PVC）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: autohealops
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-gateway
  template:
    metadata:
      labels:
        app: agent-gateway
    spec:
      containers:
        - name: agent-gateway
          image: autohealops/api-server:latest
          command: ["python", "-m", "app.agent_gateway_main"]
          ports:
            - containerPort: 9095
              name: agent-gateway
            - containerPort: 9096
              name: internal
          envFrom:
            - configMapRef:
                name: api-server-config
            - secretRef:
                name: autohealops-secrets
          volumeMounts:
            - name: agent-ca
              mountPath: /var/lib/autohealops/agent-ca
          livenessProbe:
            tcpSocket:
              port: 9096
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9096
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        # 平台自建 CA（签发 agent 客户端证书 + 网关服务端证书）
        # 必须持久化：丢了 → 所有已下发 agent 的证书失效，要逐集群重装
        - name: agent-ca
          persistentVolumeClaim:
            claimName: autohealops-agent-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-executor
  namespace: autohealops
spec:
  replicas: 1
  # 有状态 watcher（单写者）：用 Recreate 避免新旧同时 watch 双写
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-executor
  template:
    metadata:
      labels:
        app: k8s-executor
    spec:
      containers:
        - name: k8s-executor
          image: autohealops/k8s-executor:latest
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 9099
              name: logstream
          envFrom:
            - configMapRef:
                name: k8s-executor-config
            - secretRef:
                name: autohealops-secrets
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: autohealops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: autohealops/ai-service:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ai-service-config
            - secretRef:
                name: autohealops-secrets
          livenessProbe:
            httpGet:
              path: /live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autohealops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: autohealops/frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
