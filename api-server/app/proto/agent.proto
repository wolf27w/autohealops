syntax = "proto3";

package agent;

option go_package = "github.com/api-ops-platform/k8s-executor/proto/agent;agentpb";

// Agent 反向隧道（R12：agent 主动外连接入模式）
// 集群内以「单个 Deployment」部署 agent，agent 主动连平台并建立双向流；
// 平台侧把要下发的 executor 请求（method + 序列化 payload）通过隧道发给 agent，
// agent 在集群内执行后把响应（序列化 payload）回传，实现「平台 ↔ 集群」反向调用。
service AgentService {
  rpc Tunnel(stream AgentFrame) returns (stream AgentFrame);
}

message AgentFrame {
  string type = 1;        // 帧类型：register | register_ack | request | response | ping | pong | error
  int64 cluster_id = 2;   // 注册：agent 归属的集群 id
  string token = 3;       // 注册：接入令牌（平台校验）
  string req_id = 4;      // 请求/响应关联 id
  string method = 5;      // 隧道方法名（如 ExecuteCommand / GetPodLogs），对应 ExecutorService 的 rpc 名
  bytes payload = 6;      // 该方法请求或响应的序列化 protobuf（对应 executor.proto 的消息）
  string error = 7;       // 错误信息（type=error 或 response 失败时）
}
