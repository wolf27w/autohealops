<title>多集群 K8s 监控大屏 · Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#eef4ef; --panel:#ffffff; --panel-2:#f7fbf8; --elev:#f2f7f4; --fill:#e7f0ea;
    --border:#e3ede7; --border-2:#d3e2da; --line-2:#eef4f0;
    --text:#0f2018; --text-2:#5a7368; --text-3:#8aa196;
    --red:#e74c3c; --yellow:#e08a00; --green:#12b981; --blue:#0ea5e9; --cyan:#0891b2;
  }
  html[data-theme='dark']{
    --bg:#0a0e17; --panel:#0d1420; --panel-2:var(--panel-2); --elev:var(--elev); --fill:var(--fill);
    --border:#1e2a3a; --border-2:#243248; --line-2:var(--fill);
    --text:#e6edf3; --text-2:#8b9cb3; --text-3:#5b6b82;
    --red:#e74c3c; --yellow:#f39c12; --green:#2ecc71; --blue:#3b82f6; --cyan:#22d3ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;cursor:pointer}

  .pane:empty{display:none}
  .row{display:flex;gap:18px;margin-bottom:20px}
  .col{flex:1;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px 20px}
  .panel h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
  .panel h3 .sub{font-size:11px;color:var(--text-3);font-weight:400}
  .muted{color:var(--text-2)} .dim{color:var(--text-3)}
  .big{font-size:38px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .mid{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .sm{font-size:12px} .xs{font-size:11px}
  .up{color:var(--red)} .down{color:var(--green)} .warn{color:var(--yellow)}
  .kpi-label{font-size:12px;color:var(--text-2);display:flex;justify-content:space-between;align-items:center}
  .kpi-sub{font-size:12px;color:var(--text-3);margin-top:9px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;line-height:18px;border:1px solid transparent}
  .tag.red{background:rgba(231,76,60,.15);color:var(--red);border-color:rgba(231,76,60,.4)}
  .tag.yellow{background:rgba(243,156,18,.15);color:var(--yellow);border-color:rgba(243,156,18,.4)}
  .tag.green{background:rgba(46,204,113,.15);color:var(--green);border-color:rgba(46,204,113,.4)}
  .tag.gray{background:rgba(139,156,179,.12);color:var(--text-2);border-color:var(--border-2)}
  .bar{height:10px;border-radius:4px;background:var(--fill);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px}
  .bar.sm{height:7px}
  .grid-cards{display:grid;gap:12px}
  .cl-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);margin-bottom:12px;cursor:pointer;transition:.15s}
  .cl-row:hover{border-color:var(--green);background:var(--elev)}
  .cluster-card{cursor:pointer;transition:.15s;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);overflow:hidden}
  .cluster-card:hover{border-color:var(--green);transform:translateY(-1px)}
  .cluster-card .topbar{height:4px}
  .cluster-card .body{padding:12px 14px}
  .cluster-card .name{font-size:15px;font-weight:700}
  .cluster-card .stat{font-size:12px;color:var(--text-2);margin:6px 0 10px}
  .btn{display:inline-block;padding:3px 10px;border-radius:6px;border:1px solid var(--border-2);background:var(--fill);color:var(--text);
    font-size:12px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--green);color:var(--green)}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .list-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--fill)}
  .list-row:last-child{border-bottom:0}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)} .dot.green{background:var(--green)} .dot.gray{background:var(--text-3)}
  .grow{flex:1;min-width:0}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:14px;border:1px solid var(--border-2);
    background:var(--elev);font-size:12px;cursor:pointer;margin:0 6px 6px 0}
  .chip.sel{border-color:var(--green);background:var(--green);color:#fff}
  .chip.bad{border-color:rgba(231,76,60,.6)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:5px 12px;border-radius:6px;border:1px solid var(--border-2);background:var(--elev);font-size:12px;cursor:pointer;color:var(--text)}
  .tab:hover{border-color:var(--green)}
  .tab.sel{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .tab .cnt{opacity:.7;margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--fill);white-space:nowrap}
  th{color:var(--text-3);font-weight:500;font-size:11px}
  tr.bad td{background:rgba(231,76,60,.09)}
  select{background:var(--elev);color:var(--text);border:1px solid var(--border-2);border-radius:6px;padding:5px 8px;font-size:12px;min-width:260px}
  .metric{padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2)}

  .metric .sub{font-size:11px;color:var(--text-3);margin-top:3px}
  .cnt-box{padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);text-align:center}
  .cnt-box .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .cnt-box .l{font-size:11px;color:var(--text-2);margin-top:2px}
  .chart{width:100%}
  .banner{display:flex;align-items:center;gap:10px;background:rgba(14,165,233,.14);border:1px solid rgba(14,165,233,.55);
    color:var(--blue);border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:16px}
  .banner .x{margin-left:auto;cursor:pointer;color:var(--text-2)}

  .nodework.bad{border-left-color:var(--red)}

  .clockbadge b{color:var(--green);margin-right:8px;font-weight:600}
  .updbadge{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--fill);border:1px solid var(--border-2);color:var(--text-3);font-variant-numeric:tabular-nums}
  .modebadge{font-size:11px;padding:3px 12px;border-radius:10px;backdrop-filter:blur(6px)}
  .modebadge.demo{background:rgba(243,156,18,.16);color:var(--yellow);border:1px solid rgba(243,156,18,.4)}
  .modebadge.ok{background:rgba(46,204,113,.16);color:var(--green);border:1px solid rgba(46,204,113,.4)}

<body>
<div id="app"></div>
<div id="svc-panel" class="pane"></div>
<div id="node-panel" class="pane"></div>
<div id="topbar">
  <div id="clock" class="clockbadge"></div>
  <div id="mode" class="modebadge demo">数据：演示</div>
  <div id="updated" class="updbadge">更新于 --:--:--</div>
</div>

<script>
/* =========================================================
   多集群 K8s 监控大屏 · 纯前端 Demo（数据为 JS 模拟）
   设计：事件驱动优先，资源监控服务于定位
   ========================================================= */

/* ---------- 工具 ---------- */
const $ = (s, r=document) => r.querySelector(s);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const fmtPct = v => (v==null?'-':v.toFixed(0)+'%');
const lvl = v => v>=85?'red':(v>=70?'yellow':'green');
const barColor = v => v>=85?'var(--red)':(v>=70?'var(--yellow)':'var(--green)');
function bar(pct, small){ return `<div class="bar ${small?'sm':''}"><i style="width:${clamp(pct,0,100)}%;background:${barColor(pct)}"></i></div>`; }
function series(n, base, amp, noise){ const a=[]; let v=base; for(let i=0;i<n;i++){ v = v + (Math.random()-0.5)*amp + (Math.random()<0.5?-noise:noise); v=clamp(v,base*0.3,base*1.8); a.push(+v.toFixed(2)); } return a; }
function times(n){ const a=[],now=Date.now(); for(let i=n-1;i>=0;i--){ const d=new Date(now-i*5*60000); a.push(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);} return a; }
function timeAgo(min){ return min<60?`${min} 分钟`:`${(min/60).toFixed(1)} 小时`; }

/* ---------- 模拟数据 ---------- */
const CLUSTERS = [
  {id:'prod-beijing', name:'prod-beijing', env:'生产', status:'warn',  nodes:48, pods:1260, alerts:7, cpu:78, mem:64, disk:52},
  {id:'prod-shanghai',name:'prod-shanghai',env:'生产', status:'ok',    nodes:36, pods:980,  alerts:1, cpu:41, mem:55, disk:47},
  {id:'prod-guangzhou',name:'prod-guangzhou',env:'生产',status:'bad',  nodes:24, pods:640,  alerts:12,cpu:91, mem:88, disk:79},
  {id:'uat',          name:'uat',          env:'UAT',  status:'ok',    nodes:18, pods:420,  alerts:0, cpu:33, mem:44, disk:38},
  {id:'test',         name:'test',         env:'测试', status:'ok',    nodes:20, pods:510,  alerts:2, cpu:37, mem:49, disk:41},
];
const NS_LIST = ['payment','order','infra','gateway','monitoring'];
const TYPES = [{k:'deployment',n:'无状态'},{k:'statefulset',n:'有状态'},{k:'daemonset',n:'DaemonSet'}];

const OVERVIEW = {
  kpi:{
    activeAlerts:{v:22, delta:+5, deltaLabel:'较 1 小时前'},
    healing:{v:6, avgMin:8.4},
    healedToday:{v:184, rate:0.94},
    failed:{v:3, abnormalClusters:1}
  },
  waterline:[
    {dim:'CPU', pct:91, peak:'prod-guangzhou'},
    {dim:'内存', pct:88, peak:'prod-guangzhou'},
    {dim:'磁盘', pct:79, peak:'prod-guangzhou'},
    {dim:'网络吞吐', pct:63, peak:'prod-beijing'},
  ],
  alertTypes:[
    {name:'OOM / 容器重启', count:9},
    {name:'磁盘 / 存储', count:5},
    {name:'流量异常', count:4},
    {name:'探针 / 健康检查', count:3},
    {name:'调度 / 资源不足', count:1},
  ],
  heal:{success:184, failed:3, processing:6, rate:0.94, avgMin:8.4,
    stubborn:[
      {svc:'payment/payment-svc', fails:5, range:'14:02 ~ 现在'},
      {svc:'order/order-core', fails:3, range:'13:20 ~ 现在'},
    ]},
  top5:[
    {rank:1, desc:'OOMKilled 反复重启（持续 22 分钟）', cluster:'prod-guangzhou', ns:'payment', svc:'payment-svc'},
    {rank:2, desc:'磁盘使用率 91%（持续 40 分钟）', cluster:'prod-guangzhou', ns:'infra', svc:'log-collector', node:'gz-node-07'},
    {rank:3, desc:'CPU 持续 92% 未扩容（持续 18 分钟）', cluster:'prod-beijing', ns:'order', svc:'order-core'},
    {rank:4, desc:'Pod CrashLoopBackOff（持续 12 分钟）', cluster:'prod-beijing', ns:'gateway', svc:'api-gateway'},
    {rank:5, desc:'探针连续失败（持续 9 分钟）', cluster:'prod-shanghai', ns:'payment', svc:'payment-svc'},
  ],
  alerts:[
    {sev:'red', title:'OOMKilled：payment-svc 容器内存超限', cluster:'prod-guangzhou', ns:'payment', svc:'payment-svc', heal:'failed', kind:'service'},
    {sev:'red', title:'容器反复重启：payment-svc (5 次/10min)', cluster:'prod-guangzhou', ns:'payment', svc:'payment-svc', heal:'healing', kind:'service'},
    {sev:'yellow', title:'磁盘使用率 91%：gz-node-07 /data', cluster:'prod-guangzhou', ns:'infra', svc:'log-collector', node:'gz-node-07', heal:'pending', kind:'node'},
    {sev:'yellow', title:'CPU 使用率 92%：order-core', cluster:'prod-beijing', ns:'order', svc:'order-core', heal:'healing', kind:'service'},
    {sev:'yellow', title:'Pod CrashLoopBackOff：api-gateway', cluster:'prod-beijing', ns:'gateway', svc:'api-gateway', heal:'pending', kind:'service'},
    {sev:'red', title:'探针连续失败：payment-svc liveness', cluster:'prod-shanghai', ns:'payment', svc:'payment-svc', heal:'healed', kind:'service'},
  ],
  events:[
    {s:'fail', t:'❌ 自愈失败：payment-svc OOMKilled（已达最大重试）', time:'14:11'},
    {s:'run',  t:'🔄 自愈中：order-core 触发 HPA 扩容 3→5', time:'14:09'},
    {s:'ok',   t:'✅ 自愈成功：api-gateway 重建 Pod', time:'14:05'},
    {s:'ok',   t:'✅ 自愈成功：payment-svc 重启容器', time:'13:58'},
    {s:'fail', t:'❌ 自愈失败：order-core 内存未回落', time:'13:41'},
    {s:'ok',   t:'✅ 自愈成功：log-collector 清理临时文件', time:'13:30'},
  ]
};

/* 每集群服务数据（演示：按 ns+type 生成） */
function servicesOf(ns, type){
  const map = {
    payment:['payment-svc','refund-svc','wallet-svc'],
    order:['order-core','order-api','order-worker'],
    infra:['log-collector','redis-operator','metrics-agent'],
    gateway:['api-gateway','auth-gateway'],
    monitoring:['prometheus','grafana','alertmanager'],
  };
  const base = map[ns] || ['svc-a','svc-b'];
  if(type==='daemonset') return ns==='infra'?['node-exporter','filebeat']:[];
  if(type==='statefulset') return (ns==='infra'||ns==='monitoring')?base.slice(0,2): (ns==='order'?['order-db']:[]);
  return base;
}
function svcDetail(cluster, ns, type, name){
  const abnormal = name.includes('payment') || name.includes('order-core') || name.includes('api-gateway');
  const desired = type==='daemonset'?1:(abnormal?5:3);
  const ready = abnormal?(desired-1):desired;
  const pods = [];
  for(let i=0;i<desired;i++){
    const bad = abnormal && i===0;
    pods.push({
      name:`${name}-${Math.random().toString(16).slice(2,7)}-${Math.random().toString(36).slice(2,7)}`,
      status: bad?(name.includes('payment')?'CrashLoopBackOff':'Running'):'Running',
      node: `${cluster.slice(5,8)}-node-${String(Math.floor(Math.random()*20)).padStart(2,'0')}`,
      bad
    });
  }
  if(abnormal && name.includes('order-core')) pods[0].status='Pending';
  const containers = [
    {name: name.slice(0,12), image:`harbor.local/${ns}/${name}:1.4.${Math.floor(Math.random()*9)}`, cpu:'0.62 / 1', mem:'812Mi / 1Gi', restarts: abnormal?5:0, oom: abnormal?3:0, throttle:'2.4s', diskR:'12MiB/s', diskW:'3MiB/s', bad:abnormal},
    {name:'istio-proxy', image:'istio/proxyv2:1.20', cpu:'0.04 / 0.2', mem:'96Mi / 256Mi', restarts:0, oom:0, throttle:'0s', diskR:'0', diskW:'0', bad:false},
  ];
  if(type==='statefulset') containers.push({name:'exporter', image:'prom/node-exporter:v1.7', cpu:'0.01 / 0.1', mem:'24Mi / 64Mi', restarts:1, oom:0, throttle:'0s', diskR:'0', diskW:'0', bad:false});
  return {
    name, type, ns, cluster, abnormal, desired, ready,
    podList: pods,
    containers,
    metrics:{
      cpu:{v: abnormal?86:34, limit:'1000m', req:'400m'},
      mem:{v: abnormal?92:57, limit:'1Gi', req:'512Mi'},
      fs:{v:21, read:'12MiB/s'},
      net:{v:1.8, rx:'0.42%', tx:'0.31%'}, // 重传率 %
    },
    counters:{restarts: abnormal?5:0, oom: abnormal?3:0, throttle:'2.4s', retrans: 1482},
    trend:{ cpu:series(24, abnormal?80:35, 8, 3), mem:series(24, abnormal?88:55, 5, 2),
            rxLoss:series(24, abnormal?1.6:0.2, .4, .1).map(v=>+v.toFixed(2)),
            txLoss:series(24, abnormal?1.1:0.15, .3, .08).map(v=>+v.toFixed(2)),
            retrans:series(24, abnormal?1400:200, 300, 60).map(v=>Math.round(v)) }
  };
}
function nodesOf(cluster){
  const names = ['gz-node-07','gz-node-08','gz-node-11','gz-node-15','gz-node-21','gz-node-22','gz-node-31','gz-node-33'];
  return names.map((n,i)=>{
    const pressure = n==='gz-node-07'||n==='gz-node-15';
    return {name:n, cond: pressure?'DiskPressure':'Ready', pressure,
      cpu: pressure?91:(20+i*6)%100, mem: pressure?88:(40+i*4)%100, load:(1.2+i*0.7).toFixed(2), pods:18+i*3};
  });
}
function nodeDetail(cluster, node){
  const p = node.pressure;
  return {
    name:node.name, cond:node.cond, cpu:{v:node.cpu, load:node.load, cores:16}, mem:{v:node.mem, total:'64Gi'},
    disk:{iops: p?3200:900, tput:'210MiB/s', lat: p?'18ms':'2.1ms'},
    net:{rxLoss: p?'0.9%':'0.05%', txLoss: p?'0.6%':'0.03%', errs: p?12:0},
    parts:[
      {mp:'/', used: p?91:46, iops: p?2100:520, tput:'140MiB/s', lat: p?'16ms':'1.8ms'},
      {mp:'/data', used: p?79:55, iops: p?1100:380, tput:'70MiB/s', lat: p?'20ms':'2.4ms'},
      {mp:'/var/log', used: p?63:31, iops: p?320:90, tput:'8MiB/s', lat: p?'6ms':'1.1ms'},
      {mp:'/tmp', used:31, iops:60, tput:'2MiB/s', lat:'0.8ms'},
    ],
    workloads:[
      {name:'payment-svc', ns:'payment', type:'Deployment', cpu:'0.62 core', mem:'812Mi', bad:true},
      {name:'log-collector', ns:'infra', type:'DaemonSet', cpu:'0.18 core', mem:'240Mi', bad:false},
      {name:'redis-operator', ns:'infra', type:'Deployment', cpu:'0.08 core', mem:'180Mi', bad:false},
    ],
    trend:{ cpu:series(24, p?88:35, 6, 3), mem:series(24, p?85:52, 5, 2), iops:series(24, p?3000:900, 500, 120).map(v=>Math.round(v)) }
  };
}

/* ---------- 状态 ---------- */
let VIEW = { page:'overview' };

/* ---------- 增量渲染（N12）：不重建 DOM，避免每次刷新闪一下 ----------
   思路：把「模板字符串」解析后与现有 DOM 逐节点比对，只改差异（文本/属性/增删子节点）。
   节点能复用 → 不闪、不丢焦点、不重置下拉框；图表 div 不被替换 → ECharts 实例可复用。 */
const _tpl = document.createElement('template');
function _patchAttrs(cur, next){
  for(const a of [...cur.attributes]) if(!next.hasAttribute(a.name)) cur.removeAttribute(a.name);
  for(const a of [...next.attributes]) if(cur.getAttribute(a.name)!==a.value) cur.setAttribute(a.name, a.value);
}
function _sameNode(a,b){ return a && b && a.nodeType===b.nodeType && (a.nodeType===3 || a.tagName===b.tagName); }
function _patchChildren(cur, next){
  const cs=[...cur.childNodes], ns=[...next.childNodes], n=Math.max(cs.length, ns.length);
  for(let i=0;i<n;i++){
    const c=cs[i], nn=ns[i];
    if(!nn){ if(c) cur.removeChild(c); continue; }
    if(!c){ cur.appendChild(nn.cloneNode(true)); continue; }
    if(_sameNode(c,nn)) _patchNode(c,nn); else cur.replaceChild(nn.cloneNode(true), c);
  }
}
function _patchNode(cur, next){
  if(cur.nodeType===3){ if(cur.nodeValue!==next.nodeValue) cur.nodeValue=next.nodeValue; return; }
  if(cur.nodeType!==1) return;
  _patchAttrs(cur, next);
  // 图表容器：子节点由 ECharts 接管（canvas），模板里是空 div，不能按模板清空
  if(cur.classList && cur.classList.contains('chart')) return;
  // 异步填充容器（#svcbody/#nodebody）：内容由各自 render 负责，刷新时保留，避免闪回「加载中」
  if(cur.hasAttribute && cur.hasAttribute('data-keep')) return;
  // 表单控件：保留用户当前选择（否则下拉框会在刷新时被重置/闪动）
  if(cur.tagName==='SELECT'){ const v=cur.value; _patchChildren(cur,next); if([...cur.options].some(o=>o.value===v)) cur.value=v; return; }
  if(cur.tagName==='INPUT' || cur.tagName==='TEXTAREA'){ const v=cur.value; _patchChildren(cur,next); if(cur.value!==v) cur.value=v; return; }
  _patchChildren(cur, next);
}
function clearPanes(){ const a=$('#svc-panel'), b=$('#node-panel'); if(a) a.innerHTML=''; if(b) b.innerHTML=''; }
function patchHTML(el, html){
  if(!el) return;
  _tpl.innerHTML = html;
  _patchChildren(el, _tpl.content);
}

/* 图表实例池：同一 id 只 init 一次，刷新走 setOption 增量更新（不 dispose） */
const chartPool = new Map();
function mkChart(id, option){
  const dom=$('#'+id); if(!dom) return;
  let c=chartPool.get(id);
  if(!c || c.isDisposed?.() || c.getDom()!==dom){
    if(c){ try{c.dispose()}catch(e){} }
    c=echarts.init(dom, null, {renderer:'canvas'});
    chartPool.set(id, c);
  }
  c.setOption(option, {notMerge:false, lazyUpdate:true, replaceMerge:['series']});
}
function clearCharts(){ /* N12：不再销毁图表实例；DOM 被替换时由 mkChart 自动检测重建 */ }
function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function lineOpt(x, seriesArr, colors, yName){
  const ax=isDark()?'#8b9cb3':'#8aa196', ln=isDark()?'#1e2a3a':'#d3e2da', grid=isDark()?'#141d2c':'#eef4f0', tipBg=isDark()?'#0d1420':'#ffffff', tipTx=isDark()?'#e6edf3':'#0f2018';
  return {
    backgroundColor:'transparent',
    animation:false,
    grid:{left:38,right:16,top:28,bottom:26},
    tooltip:{trigger:'axis',backgroundColor:tipBg,borderColor:ln,textStyle:{color:tipTx,fontSize:11}},
    legend:{top:0,textStyle:{color:ax,fontSize:11},itemWidth:12,itemHeight:8},
    xAxis:{type:'category',data:x,boundaryGap:false,axisLine:{lineStyle:{color:ln}},axisLabel:{color:ax,fontSize:10}},
    yAxis:{type:'value',name:yName||'',nameTextStyle:{color:ax,fontSize:10},axisLabel:{color:ax,fontSize:10},splitLine:{lineStyle:{color:grid}}},
    series:seriesArr.map((s,i)=>({name:s.name,type:'line',smooth:true,symbol:'none',data:s.data,
      lineStyle:{width:2,color:colors[i%colors.length]},areaStyle:{opacity:.10,color:colors[i%colors.length]}}))
  };
}

function sumObj(o){ return Object.values(o||{}).reduce((s,x)=>s+(x||0),0); }
function parseCpuMilli(v){ if(!v) return 0; v=''+v; return v.endsWith('m')?parseFloat(v):Math.round(parseFloat(v)*1000); }
function parseMemBytes(v){ if(!v) return 0; v=''+v; const u={Ki:1024,Mi:1048576,Gi:1073741824,Ti:1099511627776,K:1e3,M:1e6,G:1e9}; for(const k in u){ if(v.endsWith(k)) return parseFloat(v)*u[k]; } return parseFloat(v)||0; }
function fmtBytes(n){ if(n==null||isNaN(n))return '-'; const u=['B','KiB','MiB','GiB','TiB']; let x=n,i=0; while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(i?1:0)+u[i]; }

/* ---- N13：跨集群容器 Top（CPU/内存）；低频（30s）缓存 ---- */
const CTOP = { cpu:[], mem:[], at:0 };
async function loadContainerTop(){
  if(Date.now()-CTOP.at < REFRESH_MS_TREND) return;
  const ids=CLUSTERS.map(c=>c.id).filter(v=>v!=null);
  if(!ids.length) return;
  const nameOf=id=>(CLUSTERS.find(c=>String(c.id)===String(id))||{}).name||('#'+id);
  const res=await Promise.all(ids.map(async id=>{
    const [cpu,mem]=await Promise.all([
      apiGet('/monitoring/clusters/'+id+'/metrics/container_cpu_top').catch(()=>null),
      apiGet('/monitoring/clusters/'+id+'/metrics/container_mem_top').catch(()=>null),
    ]);
    return {id,cpu,mem};
  }));
  const cpuRows=[], memRows=[];
  const push=(arr,rows,id)=>rows.forEach(x=>{ const m=x.metric||{};
    arr.push({cluster:nameOf(id), ns:m.namespace||'', pod:m.pod||'', c:m.container||'', v:+x.value||0}); });
  res.forEach(({id,cpu,mem})=>{ push(cpuRows,(cpu&&cpu.items)||[],id); push(memRows,(mem&&mem.items)||[],id); });
  cpuRows.sort((a,b)=>b.v-a.v); memRows.sort((a,b)=>b.v-a.v);
  CTOP.cpu=cpuRows.slice(0,10); CTOP.mem=memRows.slice(0,10); CTOP.at=Date.now();
}
function containerTopRows(rows, fmt){
  if(!rows.length) return '<tr><td colspan="5" class="dim">暂无容器级数据（需集群 Prometheus + cAdvisor）</td></tr>';
  return rows.map((r,i)=>`<tr><td class="dim">${i+1}</td><td>${r.cluster}</td>
    <td><div class="sm">${r.c}</div><div class="xs dim ell">${r.ns} / ${r.pod}</div></td>
    <td>${ctTypeTag(r.c)}</td><td style="font-weight:600">${fmt(r.v)}</td></tr>`).join('');
}

  patchHTML($('#node-panel'), `<div class="panel" style="margin-bottom:16px"><h3>${node} · 节点详情 <span class="sub">${n.ready||''} ${n.roles||''}</span></h3>
    <div class="row" style="margin-bottom:14px">
      ${[['CPU 使用率',Math.round(n.cpu_pct||0)+'%',`可分配 ${dash(n.cpu_allocatable)} 核`,n.cpu_pct||0],
         ['内存使用率',Math.round(n.mem_pct||0)+'%',`可分配 ${dash(n.mem_allocatable)}`,n.mem_pct||0],
         ['负载 / 磁盘',`${loads==null?'-':loads.toFixed(2)} / ${iopsV.toFixed(0)} IOPS`,`吞吐 ${fmtBytes(tputV)}/s`,(loads!=null&&n.cpu_allocatable&&loads>Number(n.cpu_allocatable))?88:30],
         ['网络丢包 / 错误',`${dropV.toFixed(2)} / ${errV.toFixed(2)}`,'次/秒',errV>0?80:20]]
        .map(([l,v,s,p])=>`<div class="col metric"><div class="lbl">${l}</div><div class="val" style="color:${barColor(p)}">${v}</div><div class="sub">${s}</div></div>`).join('')}
    </div>
    <div class="xs dim" style="margin-bottom:6px">磁盘分区（挂载点级）</div>
    <table style="margin-bottom:14px"><thead><tr><th>挂载点</th><th>使用率</th><th>状态</th></tr></thead><tbody>
      ${parts.slice(0,12).map(p=>`<tr class="${p.used>=85?'bad':''}"><td>${p.mp}</td><td style="width:320px"><div style="display:flex;align-items:center;gap:8px">${bar(p.used,true)}<span style="color:${barColor(p.used)}">${p.used}%</span></div></td>
        <td><span class="tag ${p.used>=85?'red':(p.used>=70?'yellow':'green')}">${p.used>=85?'偏高':(p.used>=70?'关注':'正常')}</span></td></tr>`).join('')||'<tr><td colspan="3" class="dim">无分区数据</td></tr>'}
    </tbody></table>
    <div class="xs dim" style="margin-bottom:6px">该节点上的工作负载（${wlds.length}）</div>
    <div>${wlds.slice(0,20).map(([nm,c])=>`<div class="nodework" style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="jumpToWorkload('${nm}')">
      <div class="grow"><div class="sm">${nm}</div><div class="xs dim">Pod ${c}</div></div><span class="btn">查看 →</span></div>`).join('')||'<div class="dim xs">无</div>'}</div>
  </div>
  <div class="panel"><h3>节点资源趋势（CPU / 内存 / 磁盘 IOPS）</h3><div id="ch-node" class="chart" style="height:240px"></div></div>`);
  mkChart('ch-node', lineOpt(X,[{name:'CPU%',data:mk(tcpu)},{name:'内存%',data:mk(tmem)},{name:'磁盘 IOPS',data:mk(tiops)}],['#3b82f6','#22d3ee','#a855f7'],''));
}
function setNode(n){ CV.node=n; renderNode(); }
function jumpToWorkload(nm){
  const w=(CV.workloads||[]).find(x=>x.name===nm);
  if(w){ CV.tab='service'; CV.ns=w.namespace; CV.type=w.kind; CV.svc=w.name; CV.pod=0; CV.from=`服务 ${w.namespace}/${w.name}`; renderCluster(); }
  else { CV.tab='service'; CV.svc=nm; CV.from='服务 '+nm; renderCluster(); }
}
function jumpToService(ns, svc){
  const w=(CV.workloads||[]).find(x=>x.namespace===ns&&x.name===svc);
  CV.tab='service'; CV.ns=ns; CV.svc=svc; CV.pod=0; CV.from=`服务 ${ns}/${svc}`; if(w) CV.type=w.kind; renderCluster();
}

/* ---------- 导航 ---------- */
function navCluster(id, params){
  CV = { cluster:id, tab:'service', ns:(params&&params.ns)||null, type:null, svc:(params&&params.svc)||null, node:(params&&params.node)||null, pod:0, loaded:false, workloads:null, nodes:null, nsList:null };
  if(params && params.node){ CV.tab='node'; CV.from=`节点 ${params.node}`; }
  else if(params && (params.ns||params.svc)){ CV.tab='service'; CV.from=`${params.ns||''} / ${params.svc||''}`; }
  else CV.from=null;
  renderCluster();
  openCluster();
}

/* ---------- 实时数据（同一平台 API；无 token / 失败则回退演示） ---------- */
const API='/api/v1';
/* N12：刷新节奏（老板 2026-10-19 口径 3s/5s）
   总览 5s（告警/状态变更另有 SSE 事件即时触发）；集群/容器监控 3s；趋势曲线（Prometheus range）30s。*/
const REFRESH_MS_OVERVIEW = 5000;
const REFRESH_MS_CLUSTER  = 3000;
const REFRESH_MS_TREND    = 30000;
const TOK=()=> localStorage.getItem('token') || new URLSearchParams(location.search).get('token') || '';
async function apiGet(path, timeoutMs=12000){
  // 超时保护：个别 Prometheus 慢查询不拖死整页（超时按失败处理，页面保留上次可用数据）
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(), timeoutMs);
  try{
    const r=await fetch(API+path,{headers:{Authorization:'Bearer '+TOK()}, signal:ctl.signal});
    if(!r.ok) throw new Error(path+' '+r.status);
    const j=await r.json();
    return (j&&j.data!==undefined)?j.data:j;
  } finally { clearTimeout(timer); }
}
function setMode(m){ const el=$('#mode'); if(!el) return; el.textContent = m==='real'?'数据：实时':'数据：演示'; el.className='modebadge '+(m==='real'?'ok':'demo'); }
const sevDot = s => (s==='critical'||s==='high')?'red':(s==='medium'?'yellow':'gray');
const HEAL_MAP = {pending:'pending',awaiting_approval:'healing',ticketed:'healing',resolved:'healed',self_healed:'healed',closed:'healed'};

async function loadOverviewReal(){
  const [dash, clusters, alerts, recs] = await Promise.all([
    apiGet('/stats/dashboard?range=24h&ai_range=24h'),
    apiGet('/clusters'),
    apiGet('/alerts?group=true&page=1&size=10').catch(()=>[]),
    apiGet('/repair-records?page=1&size=50').catch(()=>[]),
  ]);
  const core = dash.core||{}, cd = dash.cluster_details||[], cById = {}; clusters.forEach(c=>cById[c.id]=c);
  const byCpu = cd.slice().sort((a,b)=>(b.cpu_pct||0)-(a.cpu_pct||0));
  const byMem = cd.slice().sort((a,b)=>(b.mem_pct||0)-(a.mem_pct||0));
  OVERVIEW.kpi.activeAlerts = {v: core.alert_pending??0, delta:0, deltaLabel:'待处理告警'};
  OVERVIEW.kpi.healing = {v: Math.max(0,(core.plan_total||0)-(core.plan_completed||0)), avgMin: core.mttr_minutes??0};
  OVERVIEW.kpi.healedToday = {v: core.today_resolved??0, rate: core.heal_rate??0};
  OVERVIEW.kpi.failed = {v: core.manual_pending??0, abnormalClusters: Math.max(0,(core.cluster_total||0)-(core.cluster_healthy||0))};
  OVERVIEW.heal = { success: core.today_resolved??0, failed: core.manual_pending??0,
    processing: Math.max(0,(core.plan_total||0)-(core.plan_completed||0)), rate: core.heal_rate??0, avgMin: core.mttr_minutes??0 };
  OVERVIEW.waterline = [
    {dim:'CPU', pct: Math.round(byCpu[0]?.cpu_pct||0), peak: byCpu[0]?.name||'-'},
    {dim:'内存', pct: Math.round(byMem[0]?.mem_pct||0), peak: byMem[0]?.name||'-'},
    {dim:'磁盘', pct: 0, peak:'（暂无数据源）'},
    {dim:'网络吞吐', pct: 0, peak:'（暂无数据源）'},
  ];
  OVERVIEW.alertTypes = (dash.fault_top||[]).slice(0,5).map(f=>({name:f.fault_type, count:f.count}));
  if(!OVERVIEW.alertTypes.length) OVERVIEW.alertTypes=[{name:'（当前无告警）',count:0}];
  OVERVIEW.trend24h = (dash.trend_24h||[]).map(t=>({h:t.hour, a:t.alerts||0, s:t.healed||0}));
  // N8：总览趋势改用与仪表盘同一数据源（alert_trend：新增/已解决/自愈），保证两者一致
  OVERVIEW.trend = (dash.alert_trend||[]).map(t=>({b:String(t.bucket||''), n:t.new||0, r:t.resolved||0, s:t.self_healed||0}));
  if(!OVERVIEW.trend.length) OVERVIEW.trend = (dash.trend_24h||[]).map(t=>({b:String(t.hour||''), n:t.alerts||0, r:0, s:t.healed||0}));
  CLUSTERS.length=0;
  cd.forEach(c=>{ CLUSTERS.push({id:c.id, name:c.name, env:(cById[c.id]||{}).env||'',
    status: c.status==='healthy'?'ok':((c.alert_pending||0)>0?'warn':'ok'),
    nodes:c.node_total||0, pods:c.pods||0, alerts:c.alert_pending||0,
    cpu:Math.round(c.cpu_pct||0), mem:Math.round(c.mem_pct||0), disk:0}); });
  /* ---- 真实告警 + 自愈处理记录 ---- */
  const al = (Array.isArray(alerts)?alerts:(alerts.items||alerts.data||[]));
  const rl = (Array.isArray(recs)?recs:(recs.items||recs.data||[]));
  const SEVR = {critical:0,high:1,medium:2,low:3};
  const mkSvc = rn => String(rn||'').replace(WL_STRIP,'');
  // 实时告警/优先处理：只看「活跃」(pending) 告警——已解决的在下次刷新自动消失；历史另见「自愈事件流」
  const feed = al.map(a=>({ sev:sevDot(a.severity), sevRaw:a.severity, title:a.message||a.fault_type,
    clusterId:a.cluster_id, cluster:a.cluster_name||('#"'+a.cluster_id), ns:a.namespace||'',
    svc: a.resource_type==='node'?null:mkSvc(a.resource_name||a.deployment_name),
    node: a.resource_type==='node'?a.resource_name:null, heal:HEAL_MAP[a.status]||'pending' }));
  OVERVIEW.alerts = feed.slice(0,8);
  OVERVIEW.top5 = feed.slice().sort((a,b)=>(SEVR[a.sevRaw]??9)-(SEVR[b.sevRaw]??9)).slice(0,5)
    .map((f,i)=>({rank:i+1, desc:f.title, cluster:f.cluster, clusterId:f.clusterId, ns:f.ns, svc:f.svc, node:f.node}));
  const mkMin = ts => ts? Math.max(0, Math.round((Date.now()-new Date(ts).getTime())/60000)) : 0;
  OVERVIEW.events = rl.slice(0,20).map(r=>({ t:(r.handle_type||'自愈')+' · '+(r.fault_type||'')+' · '+(r.namespace?r.namespace+'/':'')+r.resource_name,
    time: timeAgo(mkMin(r.detected_at)), s:(r.status==='self_healed'||r.status==='resolved')?'ok':'fail' }));
  const cnt={}; rl.forEach(r=>{ if(r.resource_name) cnt[r.resource_name]=(cnt[r.resource_name]||0)+1; });
  OVERVIEW.heal.stubborn = Object.entries(cnt).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([rn,c])=>({ svc:((rl.find(r=>r.resource_name===rn)||{}).namespace||'')+'/'+rn, fails:c, range:'近期重复故障' }));
  // N13：容器 Top（跨集群，30s 缓存）—— 不阻塞总览首屏（生产 Prometheus topk 可能较慢）
  loadContainerTop().catch(()=>{});
}

function tickClock(){ const el=document.getElementById('clock'); if(!el) return; const d=new Date(), p=n=>String(n).padStart(2,'0');
  patchHTML(el, '<b>API-OPS 监控大屏</b> · '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' 周'+'日一二三四五六'[d.getDay()]); }
setInterval(tickClock,1000); tickClock();

/* ---------- 启动 ---------- */
window.addEventListener('resize', ()=>chartPool.forEach(c=>{try{c.resize()}catch(e){}}));
function markUpdated(){ const el=document.getElementById('updated'); if(!el) return; const d=new Date(), p=n=>String(n).padStart(2,'0');
  el.textContent='更新于 '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
let _refreshing = false;
async function refreshView(){
  if(document.hidden || _refreshing) return;    // 后台标签不刷新；避免慢查询叠套
  _refreshing = true;
  try{
    if(VIEW.page==='cluster'){
      // 只刷新数据（patch 增量），不重建结构；workloads 列表 30s 同步一次
      if(CV.tab==='node'){ await renderNodeDetail(); }
      else { await renderServiceBody(); }
      if(Date.now()-(CV.wlAt||0) > 30000){ CV.wlAt=Date.now(); await openCluster(); }
    } else { await loadOverviewReal(); setMode('real'); renderOverview(); }
    markUpdated();
  }catch(e){ /* 失败保留上次的「最后可用」数据，不清屏 */ }
  finally{
    _refreshing = false;
    setTimeout(refreshView, document.hidden ? 5000 : (VIEW.page==='cluster' ? REFRESH_MS_CLUSTER : REFRESH_MS_OVERVIEW));
  }
}
(async function boot(){
  try{ await loadOverviewReal(); setMode('real'); }catch(e){ setMode('demo'); }
  renderOverview();
  markUpdated();
  setTimeout(refreshView, REFRESH_MS_OVERVIEW);
})();

/* N12 自检：?selftest=1（总览）/ ?selftest=cluster（集群+容器视图）
   验证刷新后 DOM / 图表容器是否被复用（不重建）。 */
const ST = new URLSearchParams(location.search).get('selftest');
if(ST){
  if(ST==='cluster') setTimeout(()=>{ const c=CLUSTERS[0]; if(c&&c.id!=null) navCluster(c.id); }, 1200);
  if(ST==='svc'){ const qs=new URLSearchParams(location.search);
    setTimeout(()=>navCluster(Number(qs.get('cid')), {ns:qs.get('ns'), svc:qs.get('svc')}), 2500);
    const h=qs.get('hist'); if(h) setTimeout(()=>openContainerHistory(h), 6000); }
  // 等视图稳定后再取样，再等一轮刷新比较（集群模式 3s/次）
  const start = ()=>setTimeout(()=>{
    const before=$('#app').firstElementChild, cbody=$('#cbody');
    setTimeout(()=>{
      const el=document.createElement('div'); el.id='selftest';
      const rows=document.querySelectorAll('#svc-panel table tbody tr').length;
      el.textContent='selftest page='+VIEW.page
        +' dom_reused='+(before===$('#app').firstElementChild)
        +' cbody_reused='+(cbody===$('#cbody'))
        +' svc_rows='+rows+' charts='+chartPool.size
        +' mode='+(($('#mode')||{}).textContent||'');
      document.body.appendChild(el);
    }, ST==='cluster'?9000:6000);
  }, ST==='cluster'?9000:(ST==='svc'?9000:200));
  start();
}
</script>
