name: ci

# AutoHealOps 平台 CI：编译/构建校验（api-server / ai-service / frontend / k8s-executor）
on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install api-server deps
        run: |
          python -m venv api-server/.venv
          api-server/.venv/bin/pip install -q -r api-server/requirements.txt

      - name: Install ai-service deps
        run: |
          python -m venv ai-service/.venv
          ai-service/.venv/bin/pip install -q -r ai-service/requirements.txt

      - name: Install frontend deps
        run: cd frontend && npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify (compile / tsc / go build / crypto)
        run: ./scripts/ci_check.sh
        env:
          # CI 仅做静态校验，不连数据库；配置占位避免导入期报错
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/autohealops
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-dummy
          ENCRYPTION_KEY: ci-dummy-32-bytes-0123456789abcd
