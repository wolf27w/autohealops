<text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">AutoHealOps · 告警自动处理闭环</text>
<text x="40" y="68" font-size="12.5" fill="#475569">主干 ①→⑭ 自上而下；右侧为各判定点的出栈分支　·　橙色 = AI 服务，红色 = 转人工/工单，绿色 = 成功关闭</text>
<text x="40" y="100" font-size="12" font-weight="600" fill="#334155">图例</text>
<rect x="40" y="118" width="14" height="12" rx="3" fill="#dbeafe" stroke="#1e40af"/>

<text x="62" y="152" font-size="11" fill="#475569">平台处理</text>
<rect x="40" y="166" width="14" height="12" rx="3" fill="#ccfbf1" stroke="#115e59"/>
<text x="62" y="176" font-size="11" fill="#475569">证据/知识库</text>
<rect x="40" y="190" width="14" height="12" rx="3" fill="#fef3c7" stroke="#92400e"/>
<text x="62" y="200" font-size="11" fill="#475569">AI 服务</text>
<rect x="40" y="214" width="14" height="12" rx="3" fill="#fee2e2" stroke="#991b1b"/>
<text x="62" y="224" font-size="11" fill="#475569">转人工/工单</text>

<text x="62" y="248" font-size="11" fill="#475569">成功/关闭</text>

<rect x="340" y="96" width="5" height="92" rx="2.5" fill="#93c5fd"/>
<text x="358" y="122" font-size="13.5" font-weight="600" fill="#1e40af">① 故障检测 → 告警入库</text>
<text x="358" y="148" font-size="11.5" fill="#1e40af" opacity="0.85">executor watcher 发现异常</text>
<text x="358" y="164" font-size="11.5" fill="#1e40af" opacity="0.85">alerts.status = pending</text>
<rect x="340" y="238" width="370" height="92" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="238" width="5" height="92" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="264" font-size="13.5" font-weight="600" fill="#3730a3">② 触发自动处理</text>
<text x="358" y="290" font-size="11.5" fill="#3730a3" opacity="0.85">即时回调 /auto-process ＋ 30s 后台扫描</text>
<text x="358" y="306" font-size="11.5" fill="#3730a3" opacity="0.85">3 分钟单条锁：同一条不会并发处理</text>
<rect x="340" y="380" width="370" height="76" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="380" width="5" height="76" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="406" font-size="13.5" font-weight="600" fill="#3730a3">③ 入口直通判定（7 类出栈）</text>
<text x="358" y="432" font-size="11.5" fill="#3730a3" opacity="0.85">见右侧：命中任一即出栈，不进入 AI</text>
<rect x="340" y="506" width="370" height="76" rx="10" fill="#ccfbf1" stroke="#115e59" stroke-width="1.4"/>
<rect x="340" y="506" width="5" height="76" rx="2.5" fill="#5eead4"/>
<text x="358" y="532" font-size="13.5" font-weight="600" fill="#115e59">④ 断点续传</text>
<text x="358" y="558" font-size="11.5" fill="#115e59" opacity="0.85">已有诊断 / 已有方案 → 直接复用，不重复调 AI</text>
<rect x="340" y="632" width="370" height="92" rx="10" fill="#ccfbf1" stroke="#115e59" stroke-width="1.4"/>
<rect x="340" y="632" width="5" height="92" rx="2.5" fill="#5eead4"/>
<text x="358" y="658" font-size="13.5" font-weight="600" fill="#115e59">⑤ 采集证据</text>
<text x="358" y="684" font-size="11.5" fill="#115e59" opacity="0.85">Pod events ＋ 容器 stdout 日志</text>
<text x="358" y="700" font-size="11.5" fill="#115e59" opacity="0.85">崩溃容器取 --previous 日志 ＋ 进程列表</text>
<rect x="340" y="774" width="370" height="92" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="774" width="5" height="92" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="800" font-size="13.5" font-weight="600" fill="#3730a3">⑥ 代码异常判定 ＋ CrashLoop 兜底</text>
<text x="358" y="826" font-size="11.5" fill="#3730a3" opacity="0.85">强特征（NPE/Traceback/panic/段错误）→ 转人工</text>
<text x="358" y="842" font-size="11.5" fill="#3730a3" opacity="0.85">CrashLoopBackOff → 先删 Pod 重建一次（失败再 AI）</text>
<rect x="340" y="916" width="370" height="76" rx="10" fill="#ccfbf1" stroke="#115e59" stroke-width="1.4"/>
<rect x="340" y="916" width="5" height="76" rx="2.5" fill="#5eead4"/>
<text x="358" y="942" font-size="13.5" font-weight="600" fill="#115e59">⑦ 知识库命中（相似度 ≥ 0.9）</text>
<text x="358" y="968" font-size="11.5" fill="#115e59" opacity="0.85">命中 → 零 AI 复用历史可执行步骤</text>
<rect x="340" y="1042" width="370" height="76" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="1.4"/>
<rect x="340" y="1042" width="5" height="76" rx="2.5" fill="#fcd34d"/>
<text x="358" y="1068" font-size="13.5" font-weight="600" fill="#92400e">⑧ AI 诊断（ai-service）</text>
<text x="358" y="1094" font-size="11.5" fill="#92400e" opacity="0.85">root_cause ＋ suggestions ＋ 根因层</text>
<rect x="340" y="1168" width="370" height="92" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="1168" width="5" height="92" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="1194" font-size="13.5" font-weight="600" fill="#3730a3">⑨ 根因层路由（关键闸门）</text>
<text x="358" y="1220" font-size="11.5" fill="#3730a3" opacity="0.85">A 平台层 → 继续自愈</text>
<text x="358" y="1236" font-size="11.5" fill="#3730a3" opacity="0.85">B / C / D 层 → 出栈转人工</text>
<rect x="340" y="1310" width="370" height="76" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="1310" width="5" height="76" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="1336" font-size="13.5" font-weight="600" fill="#3730a3">⑩ 修复方案</text>
<text x="358" y="1362" font-size="11.5" fill="#3730a3" opacity="0.85">已有方案 → 知识库步骤 → AI 生成 → 标准动作</text>
<rect x="340" y="1436" width="370" height="108" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="1436" width="5" height="108" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="1462" font-size="13.5" font-weight="600" fill="#3730a3">⑪ 风险决策</text>
<text x="358" y="1488" font-size="11.5" fill="#3730a3" opacity="0.85">四维评分 × 环境(prod/test) × 高危命令</text>
<text x="358" y="1504" font-size="11.5" fill="#3730a3" opacity="0.85">→ auto / 单人审批 / 双人审批</text>
<text x="358" y="1520" font-size="11.5" fill="#3730a3" opacity="0.85">策略规则覆盖：force_manual / force_auto / shadow</text>
<rect x="340" y="1594" width="370" height="76" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="1594" width="5" height="76" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="1620" font-size="13.5" font-weight="600" fill="#3730a3">⑫ 循环抑制检查（仅 auto）</text>
<text x="358" y="1646" font-size="11.5" fill="#3730a3" opacity="0.85">5 分钟内同源 ≥ 5 次仍复发 → 转人工</text>
<rect x="340" y="1720" width="370" height="68" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="1.4"/>
<rect x="340" y="1720" width="5" height="68" rx="2.5" fill="#a5b4fc"/>
<text x="358" y="1746" font-size="13.5" font-weight="600" fill="#3730a3">⑬ 执行修复 → 等 Pod 重建 → 验证</text>
<rect x="340" y="1838" width="370" height="92" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.4"/>
<rect x="340" y="1838" width="5" height="92" rx="2.5" fill="#86efac"/>
<text x="358" y="1864" font-size="13.5" font-weight="600" fill="#166534">⑭ 验证通过</text>
<text x="358" y="1890" font-size="11.5" fill="#166534" opacity="0.85">status = self_healed</text>
<text x="358" y="1906" font-size="11.5" fill="#166534" opacity="0.85">沉淀知识库（下次同类告警零 AI）</text>
<rect x="340" y="2002" width="370" height="124" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.4"/>
<rect x="340" y="2002" width="5" height="124" rx="2.5" fill="#86efac"/>
<text x="358" y="2028" font-size="13.5" font-weight="600" fill="#166534">恢复 / 关闭双向闭环（独立扫描 60s）</text>
<text x="358" y="2054" font-size="11.5" fill="#166534" opacity="0.85">资源已恢复 → 告警 resolved ＋ 关闭同源告警</text>
<text x="358" y="2070" font-size="11.5" fill="#166534" opacity="0.85">反向：对应工单自动 resolved</text>
<text x="358" y="2086" font-size="11.5" fill="#166534" opacity="0.85">工单关闭 → 同故障同服务告警全部 resolved</text>
<text x="358" y="2102" font-size="11.5" fill="#166534" opacity="0.85">仪表盘靠缓存代次失效，≤5s 反映</text>
<rect x="800" y="380" width="420" height="204" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
<rect x="800" y="380" width="5" height="204" rx="2.5" fill="#cbd5e1"/>
<text x="818" y="406" font-size="13.5" font-weight="600" fill="#334155">③ 特殊分支（不走通用主线）</text>
<text x="818" y="432" font-size="11.5" fill="#334155" opacity="0.85">· 资源阈值告警（CPU/内存）→ 只通知，绝不改资源</text>
<text x="818" y="448" font-size="11.5" fill="#334155" opacity="0.85">· DB 告警 → 只出方案，绝不执行</text>
<text x="818" y="464" font-size="11.5" fill="#334155" opacity="0.85">· Pod 重启类（OOM/探针，N5）→ 检测侧已诊断+通知</text>
<text x="818" y="480" font-size="11.5" fill="#334155" opacity="0.85">· ImagePullBackOff / ErrImagePull → 规则化补 imagePullSecrets</text>
<text x="818" y="496" font-size="11.5" fill="#334155" opacity="0.85">　（验证通过 → self_healed，计入自愈）</text>
<text x="818" y="512" font-size="11.5" fill="#334155" opacity="0.85">· 镜像名/仓库类（InvalidImageName/RegistryUnavailable）→ 转人工</text>
<text x="818" y="528" font-size="11.5" fill="#334155" opacity="0.85">· TerminatingStuck → 免审批强删 → 验证 → 关闭</text>
<text x="818" y="544" font-size="11.5" fill="#334155" opacity="0.85">· 资源已恢复 → 直接关闭（含同源告警）</text>
<text x="818" y="560" font-size="11.5" fill="#334155" opacity="0.85">· 节点类告警 → 节点只读诊断（P1）→ 可隔离则 cordon+drain 审批（P2）</text>

<rect x="800" y="774" width="5" height="76" rx="2.5" fill="#fca5a5"/>
<text x="818" y="800" font-size="13.5" font-weight="600" fill="#991b1b">转人工：改代码走发布</text>
<text x="818" y="826" font-size="11.5" fill="#991b1b" opacity="0.85">（真正的代码 bug，不在平台自愈范围）</text>
<rect x="800" y="916" width="420" height="76" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="1.4"/>
<rect x="800" y="916" width="5" height="76" rx="2.5" fill="#86efac"/>
<text x="818" y="942" font-size="13.5" font-weight="600" fill="#166534">复用知识库步骤（跳过 ⑧ → 直接进 ⑩）</text>
<text x="818" y="968" font-size="11.5" fill="#166534" opacity="0.85">零 AI 调用，只做白名单/占位符校验</text>
<rect x="800" y="1042" width="420" height="76" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.4"/>
<rect x="800" y="1042" width="5" height="76" rx="2.5" fill="#fca5a5"/>
<text x="818" y="1068" font-size="13.5" font-weight="600" fill="#991b1b">AI 诊断失败 → 重试 1 次 → 仍失败转人工</text>
<text x="818" y="1094" font-size="11.5" fill="#991b1b" opacity="0.85">不静默跳过（两次失败原因写进工单）</text>
<rect x="800" y="1168" width="420" height="108" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.4"/>
<rect x="800" y="1168" width="5" height="108" rx="2.5" fill="#fca5a5"/>
<text x="818" y="1194" font-size="13.5" font-weight="600" fill="#991b1b">根因层出栈</text>
<text x="818" y="1220" font-size="11.5" fill="#991b1b" opacity="0.85">B 应用层 → 转人工（改代码/配置走发布）</text>
<text x="818" y="1236" font-size="11.5" fill="#991b1b" opacity="0.85">C 数据库层 → 转 DBA（平台不碰数据）</text>
<text x="818" y="1252" font-size="11.5" fill="#991b1b" opacity="0.85">D 基础设施层 → 转工单（基础设施团队）</text>
<rect x="800" y="1310" width="420" height="76" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.4"/>
<rect x="800" y="1310" width="5" height="76" rx="2.5" fill="#fca5a5"/>
<text x="818" y="1336" font-size="13.5" font-weight="600" fill="#991b1b">无可用方案 → 转人工</text>
<text x="818" y="1362" font-size="11.5" fill="#991b1b" opacity="0.85">知识库 / AI / 标准动作都给不出步骤时</text>
<rect x="800" y="1594" width="420" height="76" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.4"/>
<rect x="800" y="1594" width="5" height="76" rx="2.5" fill="#fca5a5"/>
<text x="818" y="1620" font-size="13.5" font-weight="600" fill="#991b1b">反复自愈失败 → 转人工</text>
<text x="818" y="1646" font-size="11.5" fill="#991b1b" opacity="0.85">循环抑制：治标不治本，交人工查根因</text>
<rect x="800" y="1696" width="420" height="108" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
<rect x="800" y="1696" width="5" height="108" rx="2.5" fill="#cbd5e1"/>
<text x="818" y="1722" font-size="13.5" font-weight="600" fill="#334155">审批分支（approval_1 / approval_2）</text>
<text x="818" y="1748" font-size="11.5" fill="#334155" opacity="0.85">建审批单 → 告警 awaiting_approval</text>
<text x="818" y="1764" font-size="11.5" fill="#334155" opacity="0.85">有在途审批单则幂等跳过（不重复建单）</text>
<text x="818" y="1780" font-size="11.5" fill="#334155" opacity="0.85">审批通过后执行，再走 ⑬ 验证</text>
<rect x="800" y="1834" width="420" height="140" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="1.4"/>
<rect x="800" y="1834" width="5" height="140" rx="2.5" fill="#fca5a5"/>
<text x="818" y="1860" font-size="13.5" font-weight="600" fill="#991b1b">转人工 ≠ 审核单，而是自动建工单</text>
<text x="818" y="1886" font-size="11.5" fill="#991b1b" opacity="0.85">① 同故障同服务已有在途工单 → 本条并入（ticketed）</text>
<text x="818" y="1902" font-size="11.5" fill="#991b1b" opacity="0.85">② 同故障工单 10 分钟内刚关闭 → 建单冷却，先不建单</text>
<text x="818" y="1918" font-size="11.5" fill="#991b1b" opacity="0.85">③ 否则：自动建工单 ＋ 通知派单（值班人/团队）</text>
<text x="818" y="1934" font-size="11.5" fill="#991b1b" opacity="0.85"></text>
<text x="818" y="1950" font-size="11.5" fill="#991b1b" opacity="0.85">告警 ↔ 工单单一闭环：工单成为唯一处理入口</text>
